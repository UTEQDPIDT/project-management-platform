services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.dev
    restart: always
    ports:
      - 3000:3000
    volumes:
      - ./apps/web:/app/apps/web # Mount local WEB source code
      - /app/apps/web/node_modules # Prevent overwriting node_modules
      - ./packages:/app/packages # Mount shared packages (optional, for monorepo)
    depends_on:
      - api
    networks:
      - app_network

  api:
    container_name: api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.dev
    restart: always
    ports:
      - 3001:3001
    env_file:
      - ./apps/api/.env
    volumes:
      - ./apps/api:/app/apps/api # Mount local API source code
      - /app/apps/api/node_modules # Prevent overwriting node_modules
      - ./packages:/app/packages # Mount shared packages (optional, for monorepo)
    depends_on:
      - mongodb
    networks:
      - app_network

  mongodb:
    image: mongo:6
    restart: always
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=user
      - MONGO_INITDB_ROOT_PASSWORD=pass
    volumes:
      - mongodb_data:/data/db
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
