services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    restart: always
    ports:
      - 3000:3000
    environment:
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_started
    networks:
      - app_network

  api:
    container_name: api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: always
    ports:
      - 3001:3001
    env_file:
      - ./apps/api/.env.production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network

  mongodb:
    container_name: mongodb
    image: mongo:6
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_KEYFILE_CONTENT=${MONGO_KEYFILE}
    volumes:
      - mongodb_data:/data/db
    entrypoint:
      - bash
      - -c
      - |
        echo "$$MONGO_KEYFILE_CONTENT" > /tmp/mongodb.key
        chmod 400 /tmp/mongodb.key
        chown 999:999 /tmp/mongodb.key
        exec docker-entrypoint.sh "$$@"
      - --
    command:
      [
        'mongod',
        '--replSet',
        'rs0',
        '--bind_ip_all',
        '--keyFile',
        '/tmp/mongodb.key',
      ]
    networks:
      - app_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand(''ping'')"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  app_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
