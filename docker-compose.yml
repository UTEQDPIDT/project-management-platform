services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    restart: always
    ports:
      - 3000:3000
    environment:
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_started
    networks:
      - app_network

  api:
    container_name: api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: always
    ports:
      - 3001:3001
    env_file:
      - ./apps/api/.env.production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network

  mongodb:
    container_name: mongodb
    image: mongo:6
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    user: root
    command: >
      bash -c "
      chmod 400 /data/configdb/mongodb.key &&
      chown 999:999 /data/configdb/mongodb.key &&
      exec gosu mongodb mongod --replSet rs0 --bind_ip_all --keyFile /data/configdb/mongodb.key
      "
    volumes:
      - mongodb_data:/data/db
      - ./mongodb.key:/data/configdb/mongodb.key
    networks:
      - app_network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  app_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
