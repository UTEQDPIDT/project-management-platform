services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    restart: always
    ports:
      - 3000:3000
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    networks:
      - app_network

  api:
    container_name: api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: always
    ports:
      - 3001:3001
    env_file:
      - ./apps/api/.env.production
    depends_on:
      - mongodb
    networks:
      - app_network

  mongodb:
    container_name: mongodb
    image: mongo:6
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    command:
      [
        'mongod',
        '--replSet',
        'rs0',
        '--bind_ip_all',
        '--keyFile',
        '/data/configdb/mongodb.key',
      ]
    volumes:
      - mongodb_data:/data/db
      - ./mongodb.key:/data/configdb/mongodb.key
    networks:
      - app_network
    healthcheck:
      test: |
        mongosh --host mongodb:27017 --quiet \
        -u "${MONGO_USER}" -p "${MONGO_PASSWORD}" --authenticationDatabase admin \
        --eval "try { rs.status().ok } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }" | grep 1
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  app_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
