services:
  api:
    container_name: api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.dev
    restart: always
    ports:
      - 3001:3001
    environment:
      - NODE_ENV=development
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network

  mongodb:
    container_name: mongodb
    image: mongo:6
    restart: always
    ports:
      - 127.0.0.1:27017:27017
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongodb_data:/data/db
    networks:
      - app_network
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30

volumes:
  mongodb_data:
    driver: local

networks:
  app_network:
    driver: bridge
